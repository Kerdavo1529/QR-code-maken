
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Download</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #f3f3f3;
  font-family: Arial, sans-serif;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.12);
  text-align: center;
  max-width: 90vw;
}

canvas {
  display: block;
  width: 520px;
  height: 520px;
  max-width: 90vw;
}

button {
  margin: 10px 5px;
  padding: 12px 22px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

input {
  display: none;
}
</style>
</head>

<body>

<div class="card">

  <canvas id="qrCanvas" width="800" height="800"></canvas>

  <br>

  <input type="file" id="logoInput" accept="image/png,image/jpeg">

  <button onclick="document.getElementById('logoInput').click()">
    Kies je logo
  </button>

  <button id="downloadBtn">
    Download PNG
  </button>

</div>

<script>

const targetUrl = "https://github.com/Willem1955/script-redirect";

const qrUrl = "https://quickchart.io/qr?text=" +
  encodeURIComponent(targetUrl) +
  "&size=800&margin=10&ecLevel=H";

const canvas = document.getElementById("qrCanvas");
const ctx = canvas.getContext("2d");

const qr = new Image();
qr.crossOrigin = "anonymous";

let logo = null;

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.closePath();
}

function drawQR() {

  ctx.clearRect(0, 0, 800, 800);

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, 800, 800);

  if (!qr.complete || !qr.naturalWidth) return;

  ctx.drawImage(qr, 0, 0, 800, 800);

  if (logo) {

    const logoSize = 145;
    const x = (800 - logoSize) / 2;
    const y = (800 - logoSize) / 2;

    ctx.fillStyle = "#ffffff";

    roundedRect(
      x - 18,
      y - 18,
      logoSize + 36,
      logoSize + 36,
      28
    );

    ctx.fill();

    // Logo behouden in originele verhouding
    const ratio = Math.min(
      logoSize / logo.width,
      logoSize / logo.height
    );

    const w = logo.width * ratio;
    const h = logo.height * ratio;

    ctx.drawImage(
      logo,
      x + (logoSize - w) / 2,
      y + (logoSize - h) / 2,
      w,
      h
    );
  }
}

qr.onload = drawQR;
qr.src = qrUrl;

document.getElementById("logoInput").addEventListener("change", function(e) {

  const file = e.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(event) {

    const newLogo = new Image();

    newLogo.onload = function() {
      logo = newLogo;
      drawQR();
    };

    newLogo.src = event.target.result;
  };

  reader.readAsDataURL(file);

  // Zelfde bestand opnieuw kunnen kiezen
  e.target.value = "";
});

document.getElementById("downloadBtn").addEventListener("click", function() {

  const link = document.createElement("a");

  link.download = "QR-code.png";
  link.href = canvas.toDataURL("image/png");

  link.click();
});

</script>

</body>
</html>
